name: Sincronizar feed y sitemap del blog

# Cada vez que cambie el registro de posts (posts.json) o el generador,
# regenera blog/feed.xml y sitemap.xml y los commitea de vuelta a master.
# El commit del bot lleva [skip ci] para no reencadenar la propia Action.

on:
  push:
    branches: [master]
    paths:
      - 'blog/posts.json'
      - 'blog/generar.mjs'
      - '.github/workflows/blog-sync.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: blog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerar feed.xml y sitemap.xml
        run: node blog/generar.mjs

      - name: Commitear si hay cambios
        run: |
          if [ -n "$(git status --porcelain blog/feed.xml sitemap.xml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add blog/feed.xml sitemap.xml
            git commit -m "Blog: regenera feed.xml y sitemap.xml [skip ci]"
            git push
            echo "Feed y sitemap actualizados."
          else
            echo "Sin cambios: feed y sitemap ya estaban al día."
          fi
