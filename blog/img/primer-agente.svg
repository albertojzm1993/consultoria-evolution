<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Muchas tareas entran por un embudo y sale un solo agente en marcha">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1016"/>
      <stop offset="1" stop-color="#070C12"/>
    </linearGradient>
    <linearGradient id="gr" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <g font-family="Onest, system-ui, sans-serif">
    <!-- tareas entrando (izquierda) -->
    <g fill="#727D93">
      <rect x="60" y="70"  width="120" height="16" rx="8" opacity=".55"/>
      <rect x="60" y="104" width="150" height="16" rx="8" opacity=".7"/>
      <rect x="60" y="138" width="104" height="16" rx="8" opacity=".45"/>
      <rect x="60" y="206" width="150" height="16" rx="8" opacity=".7"/>
      <rect x="60" y="240" width="120" height="16" rx="8" opacity=".55"/>
      <rect x="60" y="274" width="132" height="16" rx="8" opacity=".4"/>
    </g>
    <!-- embudo -->
    <path d="M250 96 L392 150 L392 210 L250 264 Z" fill="rgba(16,185,129,.10)" stroke="#34D399" stroke-width="1.5"/>
    <text x="321" y="184" text-anchor="middle" fill="#727D93" font-size="15" font-weight="600">Eliges 1</text>
    <!-- conector -->
    <line x1="392" y1="180" x2="452" y2="180" stroke="#34D399" stroke-width="2" stroke-dasharray="1.5 8" stroke-linecap="round"/>
    <path d="M466 180 L454 174 L454 186 Z" fill="#34D399"/>
    <!-- agente en marcha (derecha) -->
    <circle cx="524" cy="180" r="52" fill="rgba(16,185,129,.16)" stroke="#34D399" stroke-width="1.5"/>
    <path d="M524 150 L532 172 L554 180 L532 188 L524 210 L516 188 L494 180 L516 172 Z" fill="url(#gr)"/>
    <text x="524" y="262" text-anchor="middle" fill="#EAF0F8" font-size="15" font-weight="700">Tu primer agente</text>
  </g>
</svg>
