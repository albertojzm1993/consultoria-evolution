<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Una balanza: el coste del software pesa poco frente a las horas ahorradas">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1016"/>
      <stop offset="1" stop-color="#070C12"/>
    </linearGradient>
    <linearGradient id="gr" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <g font-family="Onest, system-ui, sans-serif">
    <!-- columna central -->
    <rect x="316" y="120" width="8" height="150" rx="4" fill="#34D399" opacity=".85"/>
    <circle cx="320" cy="114" r="10" fill="url(#gr)"/>
    <rect x="262" y="270" width="116" height="10" rx="5" fill="#727D93" opacity=".5"/>
    <!-- brazo inclinado hacia la derecha -->
    <line x1="150" y1="142" x2="490" y2="172" stroke="#34D399" stroke-width="3.5" stroke-linecap="round"/>
    <!-- platillo izquierdo: coste (arriba, ligero) -->
    <line x1="150" y1="142" x2="150" y2="170" stroke="#727D93" stroke-width="1.5"/>
    <path d="M110 170 h80 l-12 30 h-56 Z" fill="rgba(114,125,147,.14)" stroke="#727D93" stroke-width="1.5"/>
    <text x="150" y="192" text-anchor="middle" fill="#727D93" font-size="17" font-weight="600">€ software</text>
    <!-- platillo derecho: horas (abajo, pesa) -->
    <line x1="490" y1="172" x2="490" y2="212" stroke="#34D399" stroke-width="1.5"/>
    <path d="M440 212 h100 l-16 40 h-68 Z" fill="rgba(16,185,129,.18)" stroke="#34D399" stroke-width="1.5"/>
    <text x="490" y="238" text-anchor="middle" fill="#EAF0F8" font-size="18" font-weight="700">horas</text>
    <!-- titular -->
    <text x="320" y="322" text-anchor="middle" fill="#EAF0F8" font-size="19" font-weight="700">Lo que ahorras pesa más</text>
  </g>
</svg>
