<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Una ruta de cuatro pasos que asciende: elegir, calcular, montar y repetir">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1016"/>
      <stop offset="1" stop-color="#070C12"/>
    </linearGradient>
    <linearGradient id="gr" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <g font-family="Onest, system-ui, sans-serif">
    <!-- ruta ascendente que conecta los pasos -->
    <path d="M96 268 L232 220 L368 172 L504 116" fill="none" stroke="#34D399" stroke-width="3.5" stroke-linecap="round" opacity=".55"/>
    <!-- nodos de cada paso -->
    <g>
      <circle cx="96" cy="268" r="26" fill="rgba(16,185,129,.12)" stroke="#727D93" stroke-width="1.5"/>
      <text x="96" y="276" text-anchor="middle" fill="#B4BFD0" font-size="22" font-weight="700">1</text>
    </g>
    <g>
      <circle cx="232" cy="220" r="26" fill="rgba(16,185,129,.14)" stroke="#34D399" stroke-width="1.5"/>
      <text x="232" y="228" text-anchor="middle" fill="#EAF0F8" font-size="22" font-weight="700">2</text>
    </g>
    <g>
      <circle cx="368" cy="172" r="26" fill="rgba(16,185,129,.16)" stroke="#34D399" stroke-width="1.5"/>
      <text x="368" y="180" text-anchor="middle" fill="#EAF0F8" font-size="22" font-weight="700">3</text>
    </g>
    <!-- cima: paso final con bandera -->
    <g>
      <circle cx="504" cy="116" r="30" fill="url(#gr)"/>
      <path d="M498 104 v26 M498 106 h16 l-5 6 5 6 h-16" fill="#04231A" stroke="#04231A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
    <!-- titular -->
    <text x="320" y="330" text-anchor="middle" fill="#EAF0F8" font-size="19" font-weight="700">De cero a empresa agéntica, paso a paso</text>
  </g>
</svg>
